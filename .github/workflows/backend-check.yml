name: Backend checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check backend.js
          node --check config.js
          node --check case-ui.js
          node --check cockpit.js
          node --check cockpit-beta.js
          node --check beta-features.js

      - name: Check security invariants
        run: |
          if grep -R -E "SUPABASE_(ANON_KEY|SERVICE_ROLE_KEY)" supabase/functions; then
            echo "Legacy Supabase API key variable found."
            exit 1
          fi
          if grep -q "localStorage" app.js; then
            echo "Clinical app.js must not persist data in localStorage."
            exit 1
          fi
          if grep -q "MutationObserver\|document\.\|addEventListener\|setInterval" config.js; then
            echo "config.js must remain configuration-only."
            exit 1
          fi
          if grep -E -q 'from\(["'"'"']cases["'"'"']\)\.delete|from\(["'"'"']cases["'"'"']\)[[:space:]]*\.delete' config.js case-ui.js app.js backend.js cockpit.js cockpit-beta.js; then
            echo "Browser code must not delete cases directly; use clinical-store delete_case."
            exit 1
          fi
          if grep -E -q 'from\(["'"'"']cases["'"'"']\)\.update|from\(["'"'"']cases["'"'"']\)[[:space:]]*\.update' config.js case-ui.js app.js backend.js cockpit.js cockpit-beta.js; then
            echo "Browser code must not update cases directly; use clinical-store."
            exit 1
          fi
          if grep -E -q '__BachSBOInlineCaseClient|from\(["'"'"']cases["'"'"']\)' case-ui.js; then
            echo "case-ui.js must not maintain an independent cases data path; demographics must use BachSBOClinicalUi/app state."
            exit 1
          fi
          if grep -R -E 'updateCaseMetadata|update_case_metadata|saveCaseMetadata' app.js case-ui.js backend.js cockpit.js cockpit-beta.js tests/browser-smoke.mjs supabase/functions/clinical-store/index.ts; then
            echo "Metadata must persist through the canonical patient save path, not a separate metadata action."
            exit 1
          fi
          if grep -q "MutationObserver" cockpit.js; then
            echo "cockpit.js must not use DOM mutation observers."
            exit 1
          fi
          if grep -E -q 'MutationObserver|setInterval\(' case-ui.js; then
            echo "case-ui.js must use explicit render/input events, not DOM observers or polling."
            exit 1
          fi
          if grep -q 'setInterval(' cockpit.js; then
            echo "cockpit.js must use explicit render/input events, not polling."
            exit 1
          fi
          if ! grep -q 'bachsbo:ui-rendered' app.js; then
            echo "app.js must emit the explicit UI render event."
            exit 1
          fi
          if ! grep -q 'bachsbo:ui-rendered' case-ui.js || ! grep -q 'bachsbo:ui-rendered' cockpit.js; then
            echo "UI adapters must subscribe to the explicit app render event."
            exit 1
          fi
          if ! grep -q 'cockpit.js' index.html || grep -q 'cockpit-beta.js' index.html; then
            echo "Production index.html must load cockpit.js directly and never the compatibility shim."
            exit 1
          fi
          if ! grep -q 'cockpit.js' beta.html; then
            echo "beta.html must load the production cockpit foundation."
            exit 1
          fi
          if ! grep -q 'beta-features.js' beta.html || ! grep -q 'beta-features.css' beta.html; then
            echo "beta.html must load beta-only feature assets."
            exit 1
          fi
          if grep -q 'beta-features.js\|beta-features.css' index.html; then
            echo "Production index.html must not load beta-only feature assets."
            exit 1
          fi
          if grep -E -q '<script[^>]+src="[^"]*cockpit' recovery.html; then
            echo "recovery.html must remain free of cockpit scripts."
            exit 1
          fi
          if [ -e legacy.html ]; then
            echo "recovery.html is the only supported fallback; legacy.html must not be reintroduced."
            exit 1
          fi
          if ! grep -q 'data-recovery-mode="true"' recovery.html; then
            echo "recovery.html must remain explicitly marked as recovery mode."
            exit 1
          fi
          if ! grep -q 'Production implementation lives in cockpit.js' cockpit-beta.js || grep -q 'function createTabBar' cockpit-beta.js; then
            echo "cockpit-beta.js must remain only a compatibility shim."
            exit 1
          fi
          if grep -E -q 'installBackendPayloadBridge|__inlineCaseDetailsBridge|patchedSavePatient|patchedFinalizePatient' case-ui.js; then
            echo "case-ui.js must not monkey-patch backend persistence; app.js owns canonical patient state."
            exit 1
          fi
          if grep -E -q '^function (addLab|addRadiology|addConsult)\(' app.js; then
            echo "Investigation creation must use the single addInvestigation path."
            exit 1
          fi
          if ! grep -q 'addLabBtn").onclick = () => addInvestigation("lab")' app.js; then
            echo "Legacy Lab button must delegate to addInvestigation."
            exit 1
          fi
          if ! grep -q 'addRadiologyBtn").onclick = () => addInvestigation("imaging")' app.js; then
            echo "Legacy Radiology button must delegate to addInvestigation."
            exit 1
          fi
          if ! grep -q 'addConsultBtn").onclick = () => addInvestigation("consultation")' app.js; then
            echo "Legacy Consultation button must delegate to addInvestigation."
            exit 1
          fi
          if grep -E -q 'collectTestDraftsFromDom|patientTestEntryByKey' app.js; then
            echo "Investigation drafts must live in patient.tests, not be reconstructed from DOM."
            exit 1
          fi
          if ! grep -q 'testEntryStatus: entryStatus' app.js; then
            echo "app.js must expose canonical investigation status."
            exit 1
          fi
          if ! grep -q 'getPatientSnapshot' app.js; then
            echo "app.js must expose canonical patient snapshots for cockpit reads."
            exit 1
          fi
          if ! grep -q 'getPatientProgress' app.js; then
            echo "app.js must expose canonical patient progress for cockpit reads."
            exit 1
          fi
          if grep -E -q 'BachSBOBackend\?*\.?loadState|BachSBOBackend\.loadState' cockpit.js; then
            echo "cockpit.js must read live patients from BachSBOClinicalUi, not reload backend state."
            exit 1
          fi
          if grep -E -q 'function (patientTestItems|patientProgress|progressFromVisibleForm|testEntryStatus)\(' cockpit.js; then
            echo "cockpit.js must not duplicate canonical investigation/progress logic."
            exit 1
          fi
          if grep -E -q 'function (narrativeResolved|clinicalMetadata|validClinicalYob|validClinicalSex)\(' cockpit.js; then
            echo "cockpit.js must not duplicate canonical workflow completion logic."
            exit 1
          fi
          if ! grep -q 'getWorkflowStatus' app.js; then
            echo "app.js must expose canonical workflow status."
            exit 1
          fi
          if ! grep -q 'function normalizeDispositionBranches' app.js || ! grep -q 'function renderDispositionUi' app.js; then
            echo "app.js must own canonical disposition state and rendering."
            exit 1
          fi
          if grep -E -q 'fDisposition|fDischargeCondition|ensureDischargeConditionUi|commitDischargeDraft' case-ui.js; then
            echo "case-ui.js must remain a demographics adapter and must not own disposition."
            exit 1
          fi
          if grep -q 'function syncDischargeConditionVisual' cockpit.js; then
            echo "cockpit.js must not duplicate disposition visual state."
            exit 1
          fi
          if grep -q 'Object.assign(current, result.patient)' app.js; then
            echo "Autosave must preserve canonical patient/test object identity."
            exit 1
          fi
          if grep -q 'querySelectorAll('"'"'\[data-cockpit-panel="tests"\] \.test-card'"'"')' cockpit.js; then
            echo "Cockpit must not derive investigation completion from rendered test-card classes."
            exit 1
          fi
          if ! grep -q 'action: "delete_case"' backend.js; then
            echo "backend.js is missing the secure delete_case bridge."
            exit 1
          fi
          if ! grep -q 'body?.action === "delete_case"' supabase/functions/clinical-store/index.ts; then
            echo "clinical-store is missing the server-side delete_case action."
            exit 1
          fi
          if ! grep -q 'function caseRowFromPatient' supabase/functions/clinical-store/index.ts || ! grep -q 'function summaryRowFromPatient' supabase/functions/clinical-store/index.ts; then
            echo "clinical-store must use canonical case/summary serializers."
            exit 1
          fi
          if [ "$(grep -c 'year_of_birth:' supabase/functions/clinical-store/index.ts)" -ne 1 ]; then
            echo "Case year_of_birth mapping must exist only in the canonical serializer."
            exit 1
          fi
          if [ "$(grep -c 'caseRowFromPatient(patient, ownerId, now)' supabase/functions/clinical-store/index.ts)" -ne 3 ]; then
            echo "saveState, savePatient and finalizePatient must all use caseRowFromPatient."
            exit 1
          fi
          if [ "$(grep -c 'summaryRowFromPatient(patient, ownerId, now)' supabase/functions/clinical-store/index.ts)" -ne 3 ]; then
            echo "saveState, savePatient and finalizePatient must all use summaryRowFromPatient."
            exit 1
          fi
          if grep -R -E "verify_jwt[[:space:]]*=[[:space:]]*true" supabase/config.toml; then
            echo "New Supabase API keys require in-function JWT validation; gateway verify_jwt must stay false."
            exit 1
          fi
          for f in clinical-store generate-summary analyze-style analyze-skill learning-admin case-assistant; do
            if ! grep -q "APP_OWNER_USER_ID" "supabase/functions/$f/index.ts"; then
              echo "$f is missing the single-owner authorization check."
              exit 1
            fi
          done

      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/_shared/deidentify.ts
          deno check supabase/functions/clinical-store/index.ts
          deno check supabase/functions/generate-summary/index.ts
          deno check supabase/functions/analyze-style/index.ts
          deno check supabase/functions/analyze-skill/index.ts
          deno check supabase/functions/learning-admin/index.ts
          deno check supabase/functions/case-assistant/index.ts
          deno check supabase/functions/backend-diagnostics/index.ts

      - name: Run privacy regression tests
        run: |
          deno test supabase/functions/_shared/deidentify.test.ts
          deno test supabase/functions/_shared/openai.test.ts

      - name: Setup Node for browser smoke
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run assistant apply core tests
        run: node tests/assistant-core.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: |
          python3 -m http.server 4173 >/tmp/bachsbo-smoke-server.log 2>&1 &
          SMOKE_BASE_URL=http://127.0.0.1:4173 node tests/browser-smoke.mjs
