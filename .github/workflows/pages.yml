name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html recovery.html beta.html styles.css app.js backend.js config.js case-ui.js assistant-core.js cockpit.js cockpit-beta.js .nojekyll _site/

      - name: Verify local script assets
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          for (const htmlName of ["index.html", "recovery.html", "beta.html"]) {
            const html = fs.readFileSync(path.join("_site", htmlName), "utf8");
            const sources = [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["']/gi)]
              .map((match) => match[1])
              .filter((source) => !/^(?:https?:)?\/\//i.test(source));

            for (const source of sources) {
              const localPath = source.split(/[?#]/, 1)[0].replace(/^\.\//, "");
              if (!fs.existsSync(path.join("_site", localPath))) {
                throw new Error(`${htmlName} references missing local script: ${localPath}`);
              }
            }
          }
          NODE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
