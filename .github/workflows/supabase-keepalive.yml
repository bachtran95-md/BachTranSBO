name: Supabase keep alive

on:
  workflow_dispatch:
  schedule:
    # Three small database requests per day.
    # UTC times avoid DST drift; exact local clock time is not important here.
    - cron: "17 0 * * *"
    - cron: "17 8 * * *"
    - cron: "17 16 * * *"

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read public Supabase configuration
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const fs = require("fs");
          const source = fs.readFileSync("config.js", "utf8");
          const url = source.match(/supabaseUrl:\s*"([^"]+)"/)?.[1];
          const key = source.match(/supabasePublishableKey:\s*"([^"]+)"/)?.[1];

          if (!url || !key) {
            throw new Error("Could not read Supabase public configuration from config.js");
          }

          console.log(`SUPABASE_URL=${url}`);
          console.log(`SUPABASE_PUBLISHABLE_KEY=${key}`);
          NODE

      - name: Ping Supabase database
        shell: bash
        run: |
          response="$(
            curl               --fail-with-body               --silent               --show-error               --retry 3               --retry-all-errors               --max-time 20               -X POST               "$SUPABASE_URL/rest/v1/rpc/bach_sbo_keepalive"               -H "apikey: $SUPABASE_PUBLISHABLE_KEY"               -H "Content-Type: application/json"               -d '{}'
          )"

          if [ "$response" != "true" ]; then
            echo "Unexpected keep-alive response: $response"
            exit 1
          fi

          echo "Supabase keep-alive succeeded."
